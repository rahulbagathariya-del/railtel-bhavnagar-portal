name: Inject auth gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: github.event.head_commit.message != 'Inject auth gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject gate scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for tag in ['<script src="auth-gate.js"></script>','<script src="auth-gate-fix.js"></script>']:
              if tag not in s:
                  s=s.replace('</body>', tag+'</body>')
          p.write_text(s)
          PY
      - name: Commit gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Inject auth gate'
          git push

# Ensure authentication gate scripts are present after portal updates.

name: Guest-first login layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: github.event.head_commit.message != 'Inject login layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add login layout script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="login-layout.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Inject login layout'
          git push

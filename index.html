<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RailTel Corporation Of India Limited | Bhavnagar Division</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>:root{--b:#0757a5;--r:#d71920;--t:#172033;--m:#718096;--l:#e5eaf0;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,Arial,sans-serif}.top{height:3px;background:linear-gradient(90deg,var(--b) 0 82%,var(--r) 82%)}header{background:#fff;border-bottom:1px solid var(--l)}.nav{max-width:1080px;margin:auto;padding:20px;display:flex;align-items:center;justify-content:center;position:relative}.brand{text-align:center}.logo{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 8px}.brand strong{display:block;font-size:25px}.division{display:block;margin-top:4px;font-size:14px;font-weight:500;color:var(--m)}.actions{position:absolute;right:20px;top:20px;display:flex;gap:7px;align-items:center}.admin,.guest{border:1px solid var(--l);background:#fff;color:var(--b);padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:600}.guest{background:#eef4fa}.hero,.content{max-width:1080px;margin:auto;padding-left:20px;padding-right:20px}.hero{padding-top:38px;padding-bottom:28px}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:var(--m);font-size:13px}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:8px 0 18px}.bar h2{font-size:17px;margin:0}.search{width:260px;border:1px solid var(--l);background:#fff;border-radius:8px;padding:10px 12px;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.folder{background:#fff;border:1px solid var(--l);border-radius:12px;padding:18px;cursor:pointer;transition:.15s;min-height:125px}.folder:hover{border-color:#b9cee3;box-shadow:0 5px 16px #1231}.folder-icon{font-size:40px;line-height:1;margin-bottom:12px}.folder h3{margin:0;font-size:17px}.folder p{margin:6px 0 0;color:var(--m);font-size:11px}.folder .open-hint{margin-top:13px;color:var(--b);font-size:11px;font-weight:650}.btn{border:0;border-radius:7px;padding:8px 10px;font-size:11px;font-weight:650;cursor:pointer}.primary{background:var(--b);color:#fff}.light{background:#eef4fa;color:var(--b)}.danger{background:#fdecec;color:#b42318}footer{text-align:center;border-top:1px solid var(--l);background:#fff;padding:20px;color:var(--m);font-size:11px}.developer{margin-top:6px;font-size:11px;color:#596579;font-weight:500}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.panel{background:#fff;width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:20px}.close{float:right;border:0;background:#f1f4f7;border-radius:7px;padding:6px 9px;cursor:pointer}.drive-head{display:flex;align-items:center;gap:10px;padding:8px 0 12px;border-bottom:1px solid var(--l)}.drive-folder{font-size:27px}.drive-title{font-size:20px;font-weight:700}.drive-sub{color:var(--m);font-size:11px;margin-top:3px}.doc{border:1px solid var(--l);padding:11px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px}.doc-main{display:flex;align-items:center;gap:10px;min-width:0}.doc-icon{font-size:23px}.doc-name{font-weight:600;word-break:break-word}.doc-meta{font-size:10px;color:var(--m);margin-top:3px}.doc-actions{display:flex;gap:6px;flex-shrink:0}.qr{text-align:center}.qrbox{width:232px;height:232px;margin:16px auto;display:flex;align-items:center;justify-content:center;padding:16px;border:1px solid var(--l);border-radius:10px;background:#fff}.qrbox canvas{display:block!important;margin:0!important}.qrbox img{display:none!important}.url{font-size:10px;color:var(--m);word-break:break-all}.login{max-width:320px;margin:auto}.login input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--l);border-radius:8px}.upload{margin-top:15px;padding:18px;border:1px dashed #cbd6e2;border-radius:9px;text-align:center;font-size:12px;color:var(--m)}.notice{font-size:11px;margin-top:12px;color:#b42318}.status{font-size:11px;margin-top:8px;color:var(--m)}.forgot{display:block;text-align:center;margin-top:10px;color:var(--b);font-size:11px;cursor:pointer}.progress-wrap{display:none;margin-top:14px;text-align:left}.progress-wrap.show{display:block}.progress-head{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--m);margin-bottom:6px}.progress-track{height:9px;background:#e9eef4;border-radius:99px;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--b);transition:width .2s ease;border-radius:99px}.file-types{margin-top:7px;font-size:10px;color:#8a95a5}.success{color:#18794e!important}.empty{padding:22px;text-align:center;color:var(--m);font-size:12px;background:#f8fafc;border-radius:8px;margin-top:12px}.guest-note{padding:10px;background:#fff8e6;border:1px solid #f3df9b;border-radius:8px;font-size:10px;color:#765b00;margin-top:10px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:470px){.grid{grid-template-columns:1fr}.hero h1{font-size:26px}.actions{right:12px;top:14px;flex-direction:column;align-items:stretch}.admin,.guest{font-size:10px;padding:7px 9px}.logo{width:78px;height:78px}.brand strong{font-size:20px}.division{font-size:12px}.bar{align-items:stretch;flex-direction:column}.search{width:100%}}</style></head><body><div class="top"></div><header><div class="nav"><div class="brand"><img class="logo" src="RailTel_L.png" alt="RailTel official logo"><strong>RailTel Corporation Of India Limited</strong><span class="division">Bhavnagar Division</span></div><div class="actions"><button class="guest" onclick="guestLogin()">Guest Login</button><button class="admin" onclick="adminLogin()">Admin Login</button></div></div></header><section class="hero"><h1>PoP Document Portal</h1><p>Select a PoP folder to view its uploaded documents, similar to Google Drive.</p></section><main class="content"><div class="bar"><h2>PoP Folders</h2><input class="search" id="search" placeholder="Search PoP location" oninput="render()"></div><div class="grid" id="grid"></div></main><footer>RailTel Corporation Of India Limited · Bhavnagar Division<div class="developer">Developed By Rahul Bagathariya (Assistant Manager)</div></footer><div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="panel"><button class="close" onclick="closeM()">×</button><h2 id="title"></h2><div id="body"></div></div></div><script>const SUPA_URL='https://xmhdpqviwbtsuaaoxplo.supabase.co',SUPA_KEY='sb_publishable_NPBWNlDlQZMZ9_hN5UWcqQ_pcZP3eKg',sb=supabase.createClient(SUPA_URL,SUPA_KEY),rooms=['Bhavnagar','Dhola','Botad','Dhasa','Khijadiya','Savarkundla','Rajula','Mahuva','Gondal','Jetalsar','Junagadh','Keshod','Veraval'];const GUEST_USER='guest',GUEST_PASS='Guest@2026';let guestAuthenticated=false;const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const icon=f=>{let x=(f||'').toLowerCase();if(x.endsWith('.pdf'))return'📕';if(/\.(doc|docx)$/.test(x))return'📘';if(/\.(xls|xlsx|csv)$/.test(x))return'📗';if(/\.(ppt|pptx)$/.test(x))return'📙';if(/\.(jpg|jpeg|png|gif|webp|svg)$/.test(x))return'🖼️';if(/\.(zip|rar|7z)$/.test(x))return'🗜️';return'📄'};function url(r){return location.href.split('#')[0]+'#pop='+encodeURIComponent(r)}async function getDocs(r){const {data,error}=await sb.from('pop_documents').select('*').eq('pop_name',r).order('created_at',{ascending:false});if(error){console.error(error);return[]}return data||[]}function render(){let q=document.getElementById('search').value.toLowerCase(),g=document.getElementById('grid');g.innerHTML=rooms.filter(r=>r.toLowerCase().includes(q)).map(r=>`<article class="folder" onclick="details('${r}')"><div class="folder-icon">📁</div><h3>${esc(r)}</h3><p>RailTel · PoP Location</p><div class="open-hint">Open folder →</div></article>`).join('')}function openM(t,b){document.getElementById('title').textContent=t;document.getElementById('body').innerHTML=b;document.getElementById('modal').classList.add('open')}function closeM(){document.getElementById('modal').classList.remove('open')}function guestLogin(){openM('Guest Login',`<div class="login"><p style="color:#718096;font-size:12px">Use the common guest account to view PoP folders and documents.</p><input id="guestUser" type="text" placeholder="Username"><input id="guestPass" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:6px" onclick="guestSignIn()">Continue as Guest</button><div class="guest-note">Guest access is view-only. Upload and delete functions are available only to Admin.</div><div class="notice" id="guestStatus"></div></div>`)}function guestSignIn(){const u=document.getElementById('guestUser').value.trim(),p=document.getElementById('guestPass').value,status=document.getElementById('guestStatus');if(u===GUEST_USER&&p===GUEST_PASS){guestAuthenticated=true;sessionStorage.setItem('rail_guest','1');status.className='notice success';status.textContent='Guest access granted.';setTimeout(closeM,400)}else{status.textContent='Invalid guest username or password.'}}function adminLogin(){openM('Admin Login',`<div class="login"><p style="color:#718096;font-size:12px">Admin authentication is handled securely.</p><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:6px" onclick="login()">Sign in</button><span class="forgot" onclick="forgotPassword()">Forgot password?</span><div class="notice" id="loginStatus"></div></div>`)}async function login(){const status=document.getElementById('loginStatus'),email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(!email||!pass){status.textContent='Enter email and password.';return}status.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error){status.textContent=error.message||'Authentication failed.';return}adminPanel()}async function forgotPassword(){const email=document.getElementById('email').value.trim(),status=document.getElementById('loginStatus');if(!email){status.textContent='Enter your admin email first.';return}status.textContent='Sending password reset email…';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error){status.textContent=error.message;return}status.className='notice success';status.textContent='Password reset email sent.'}async function resetPassword(){const status=document.getElementById('resetStatus'),p=document.getElementById('newPass').value;if(!p||p.length<6){status.textContent='Password must be at least 6 characters.';return}const {error}=await sb.auth.updateUser({password:p});if(error){status.textContent=error.message;return}status.className='notice success';status.textContent='Password updated successfully.';setTimeout(()=>{closeM();adminLogin()},1000)}function showReset(){openM('Set New Admin Password',`<div class="login"><p style="color:#718096;font-size:12px">Enter a new password for your admin account.</p><input id="newPass" type="password" placeholder="New password"><button class="btn primary" style="width:100%;margin-top:6px" onclick="resetPassword()">Update Password</button><div class="notice" id="resetStatus"></div></div>`)}sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showReset()});async function adminPanel(){openM('Admin · PoP Document Management',`<select id="sel" style="width:100%;padding:10px;border:1px solid #e5eaf0;border-radius:8px">${rooms.map(r=>`<option>${r}</option>`).join('')}</select><div class="upload"><b>Upload documents</b><br><input type="file" id="files" accept="*/*" multiple style="margin-top:9px"><div class="file-types">PDF, Word, Excel, PowerPoint, images, ZIP and other file formats are supported.</div><div class="progress-wrap" id="progressWrap"><div class="progress-head"><span id="progressName">Preparing…</span><span id="progressPercent">0%</span></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div></div><div id="uploadStatus" class="status"></div></div><div id="list"></div><button class="btn light" style="margin-top:12px" onclick="sb.auth.signOut();closeM()">Sign out</button>`);document.getElementById('sel').onchange=adminRefresh;document.getElementById('files').onchange=upload;adminRefresh()}async function adminRefresh(){let r=document.getElementById('sel').value,list=await getDocs(r);document.getElementById('list').innerHTML=list.map(d=>`<div class="doc"><div class="doc-main"><div class="doc-icon">${icon(d.file_name)}</div><div><div class="doc-name">${esc(d.file_name)}</div><div class="doc-meta">${esc(d.file_type||'File')}${d.file_size?' · '+formatSize(d.file_size):''}</div></div></div><div class="doc-actions"><button class="btn light" onclick="openDoc('${encodeURIComponent(d.storage_path)}')">Open</button><button class="btn danger" onclick="deleteDoc('${encodeURIComponent(d.storage_path)}','${esc(d.id)}')">Delete</button></div></div>`).join('')||'<div class="empty">No documents in this PoP.</div>'}async function deleteDoc(encodedPath,id){if(!confirm('Delete this document permanently?'))return;const status=document.getElementById('uploadStatus');if(status)status.textContent='Deleting document…';const path=decodeURIComponent(encodedPath);const {error:storageError}=await sb.storage.from('pop-documents').remove([path]);if(storageError){if(status)status.textContent='Delete failed: '+storageError.message;return}const {error:dbError}=await sb.from('pop_documents').delete().eq('id',id);if(dbError){if(status)status.textContent='File removed, but database record could not be removed: '+dbError.message;return}if(status){status.className='status success';status.textContent='Document deleted successfully.'}adminRefresh()}function setProgress(name,p){const w=document.getElementById('progressWrap'),b=document.getElementById('progressBar'),n=document.getElementById('progressName'),pc=document.getElementById('progressPercent');if(!w)return;w.classList.add('show');n.textContent=name;const v=Math.max(0,Math.min(100,p));b.style.width=v+'%';pc.textContent=Math.round(v)+'%'}function uploadOne(session,r,f,onProgress){return new Promise(async(resolve,reject)=>{const path=r+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const parts=path.split('/').map(encodeURIComponent).join('/');const xhr=new XMLHttpRequest();xhr.open('POST',SUPA_URL+'/storage/v1/object/pop-documents/'+parts);xhr.setRequestHeader('Authorization','Bearer '+session.access_token);xhr.setRequestHeader('apikey',SUPA_KEY);xhr.setRequestHeader('x-upsert','false');xhr.setRequestHeader('cache-control','3600');xhr.setRequestHeader('content-type',f.type||'application/octet-stream');xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(Math.round(e.loaded/e.total*100))};xhr.onload=async()=>{if(xhr.status>=200&&xhr.status<300){const ins=await sb.from('pop_documents').insert({pop_name:r,file_name:f.name,file_type:f.type||'application/octet-stream',file_size:f.size,storage_path:path});if(ins.error){reject(new Error('Database record failed: '+ins.error.message));return}resolve()}else{let msg='Upload failed';try{const j=JSON.parse(xhr.responseText);msg=j.message||j.error||msg}catch(e){}reject(new Error(msg+' ('+xhr.status+')'))}};xhr.onerror=()=>reject(new Error('Network error during upload'));xhr.onabort=()=>reject(new Error('Upload cancelled'));xhr.send(f)})}async function upload(){const session=(await sb.auth.getSession()).data.session;if(!session){alert('Please sign in again.');return}const r=document.getElementById('sel').value,input=document.getElementById('files'),status=document.getElementById('uploadStatus'),files=Array.from(input.files||[]);if(!files.length)return;status.className='status';status.textContent='Starting upload…';let done=0;try{for(const f of files){setProgress('Uploading '+f.name,0);await uploadOne(session,r,f,p=>{const overall=((done+p/100)/files.length)*100;setProgress('Uploading '+f.name,overall)});done++;setProgress(done===files.length?'Upload complete':'Completed '+f.name,(done/files.length)*100)}status.className='status success';status.textContent=files.length===1?'File uploaded successfully.':files.length+' files uploaded successfully.';input.value='';adminRefresh()}catch(e){status.className='status';status.textContent=e.message||'Upload failed.'}}render();const initial=location.hash.match(/^#pop=(.+)$/);if(initial){const r=decodeURIComponent(initial[1]);if(rooms.includes(r))details(r)}</script><script src="auth-gate.js"></script><script src="auth-gate-fix.js"></script><script src="login-layout.js"></script></body></html>

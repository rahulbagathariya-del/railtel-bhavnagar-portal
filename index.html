<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RailTel Corporation Of India Limited | Bhavnagar Division</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>:root{--b:#0757a5;--r:#d71920;--t:#172033;--m:#718096;--l:#e5eaf0;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,Arial,sans-serif}.top{height:3px;background:linear-gradient(90deg,var(--b) 0 82%,var(--r) 82%)}header{background:#fff;border-bottom:1px solid var(--l)}.nav{max-width:1080px;margin:auto;padding:20px;display:flex;align-items:center;justify-content:center;position:relative}.brand{text-align:center}.logo{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 8px}.brand strong{display:block;font-size:25px}.division{display:block;margin-top:4px;font-size:14px;font-weight:500;color:var(--m)}.admin{position:absolute;right:20px;top:28px;border:1px solid var(--l);background:#fff;color:var(--b);padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:600}.hero,.content{max-width:1080px;margin:auto;padding-left:20px;padding-right:20px}.hero{padding-top:38px;padding-bottom:28px}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:var(--m);font-size:13px}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:8px 0 18px}.bar h2{font-size:17px;margin:0}.search{width:260px;border:1px solid var(--l);background:#fff;border-radius:8px;padding:10px 12px;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.room{background:#fff;border:1px solid var(--l);border-radius:11px;padding:17px}.room h3{margin:0;font-size:17px}.room p{margin:6px 0 16px;color:var(--m);font-size:11px}.actions{display:flex;gap:7px}.btn{border:0;border-radius:7px;padding:8px 10px;font-size:11px;font-weight:650;cursor:pointer}.primary{background:var(--b);color:#fff}.light{background:#eef4fa;color:var(--b)}footer{text-align:center;border-top:1px solid var(--l);background:#fff;padding:20px;color:var(--m);font-size:11px}.developer{margin-top:6px;font-size:11px;color:#596579;font-weight:500}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.panel{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:20px}.close{float:right;border:0;background:#f1f4f7;border-radius:7px;padding:6px 9px;cursor:pointer}.doc{border:1px solid var(--l);padding:10px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.qr{text-align:center}.qrbox{width:232px;height:232px;margin:16px auto;display:flex;align-items:center;justify-content:center;padding:16px;border:1px solid var(--l);border-radius:10px;background:#fff}.qrbox canvas{display:block!important;margin:0!important}.url{font-size:10px;color:var(--m);word-break:break-all}.login{max-width:320px;margin:auto}.login input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--l);border-radius:8px}.upload{margin-top:15px;padding:18px;border:1px dashed #cbd6e2;border-radius:9px;text-align:center;font-size:12px;color:var(--m)}.notice{font-size:11px;margin-top:12px;color:#b42318}.status{font-size:11px;margin-top:8px;color:var(--m)}.forgot{display:block;text-align:center;margin-top:10px;color:var(--b);font-size:11px;cursor:pointer}.progress-wrap{display:none;margin-top:14px;text-align:left}.progress-wrap.show{display:block}.progress-head{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--m);margin-bottom:6px}.progress-track{height:9px;background:#e9eef4;border-radius:99px;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--b);transition:width .2s ease;border-radius:99px}.file-types{margin-top:7px;font-size:10px;color:#8a95a5}.success{color:#18794e!important}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:470px){.grid{grid-template-columns:1fr}.hero h1{font-size:26px}.admin{font-size:11px;right:12px}.logo{width:78px;height:78px}.brand strong{font-size:20px}.division{font-size:12px}}</style></head><body><div class="top"></div><header><div class="nav"><div class="brand"><img class="logo" src="RailTel_L.png" alt="RailTel official logo"><strong>RailTel Corporation Of India Limited</strong><span class="division">Bhavnagar Division</span></div><button class="admin" onclick="adminLogin()">Admin Login</button></div></header><section class="hero"><h1>PoP Details Portal</h1><p>Read-only access to PoP information, documents and QR codes.</p></section><main class="content"><div class="bar"><h2>PoP Locations</h2><input class="search" id="search" placeholder="Search PoP location" oninput="render()"></div><div class="grid" id="grid"></div></main><footer>RailTel Corporation Of India Limited · Bhavnagar Division<div class="developer">Developed By Rahul Bagathariya (Assistant Manager)</div></footer><div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="panel"><button class="close" onclick="closeM()">×</button><h2 id="title"></h2><div id="body"></div></div></div><script>const SUPA_URL='https://xmhdpqviwbtsuaaoxplo.supabase.co';const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ4bWhkcHF2aXZ3YnRzdWFhb3hwbG8iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MDc4ODI3NiwiZXhwIjoyMTA2MzY0Mjc2fQ.6mmtxd0s0f9crEcdgRKOCJ00sX1xCl4OkXxjzXxHUwM';const sb=supabase.createClient(SUPA_URL,SUPA_KEY),rooms=['Bhavnagar','Dhola','Botad','Dhasa','Khijadiya'];const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function url(r){return location.href.split('#')[0]+'#pop='+encodeURIComponent(r)}async function getDocs(r){const {data,error}=await sb.from('pop_documents').select('*').eq('pop_name',r).order('created_at',{ascending:false});if(error){console.error(error);return[]}return data||[]}function render(){let q=document.getElementById('search').value.toLowerCase(),g=document.getElementById('grid');g.innerHTML=rooms.filter(r=>r.toLowerCase().includes(q)).map(r=>`<article class="room"><h3>${r}</h3><p>RailTel · PoP Location</p><div class="actions"><button class="btn primary" onclick="details('${r}')">View PoP Details</button><button class="btn light" onclick="qr('${r}')">QR Code</button></div></article>`).join('')}function openM(t,b){document.getElementById('title').textContent=t;document.getElementById('body').innerHTML=b;document.getElementById('modal').classList.add('open')}function closeM(){document.getElementById('modal').classList.remove('open')}async function details(r){let list=await getDocs(r);let html=list.length?list.map(d=>`<div class="doc"><span>📄 ${esc(d.file_name)}</span><button class="btn light" onclick="openDoc('${encodeURIComponent(d.storage_path)}')">Open</button></div>`).join(''):'<p style="color:#718096;font-size:12px">No documents uploaded yet.</p>';openM(r+' PoP Details',`<p style="color:#718096;font-size:12px">Documents stored for ${esc(r)} PoP.</p>${html}`)}function openDoc(path){const p=decodeURIComponent(path),{data}=sb.storage.from('pop-documents').getPublicUrl(p);window.open(data.publicUrl,'_blank')}function qr(r){openM(r+' · PoP QR Code',`<div class="qr"><b>Scan to open ${r} PoP Details</b><div class="qrbox" id="code"></div><div class="url">${esc(url(r))}</div><button class="btn primary" onclick="window.print()">Print QR</button></div>`);new QRCode(document.getElementById('code'),{text:url(r),width:200,height:200,colorDark:'#0757a5',colorLight:'#fff'})}function adminLogin(){openM('Admin Login',`<div class="login"><p style="color:#718096;font-size:12px">Admin authentication is handled securely.</p><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:6px" onclick="login()">Sign in</button><span class="forgot" onclick="forgotPassword()">Forgot password?</span><div class="notice" id="loginStatus"></div></div>`)}async function login(){const status=document.getElementById('loginStatus');const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(!email||!pass){status.textContent='Enter email and password.';return}status.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error){status.textContent=error.message||'Authentication failed.';return}adminPanel()}async function forgotPassword(){const email=document.getElementById('email').value.trim(),status=document.getElementById('loginStatus');if(!email){status.textContent='Enter your admin email first.';return}status.textContent='Sending password reset email…';const redirectTo=location.origin+location.pathname;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(error){status.textContent=error.message;return}status.className='notice success';status.textContent='Password reset email sent. Open the link from this portal.'}async function resetPassword(){const status=document.getElementById('resetStatus'),p=document.getElementById('newPass').value;if(!p||p.length<6){status.textContent='Password must be at least 6 characters.';return}const {error}=await sb.auth.updateUser({password:p});if(error){status.textContent=error.message;return}status.className='notice success';status.textContent='Password updated successfully. You can now sign in.';setTimeout(()=>{closeM();adminLogin()},1000)}function showReset(){openM('Set New Admin Password',`<div class="login"><p style="color:#718096;font-size:12px">Enter a new password for your admin account.</p><input id="newPass" type="password" placeholder="New password"><button class="btn primary" style="width:100%;margin-top:6px" onclick="resetPassword()">Update Password</button><div class="notice" id="resetStatus"></div></div>`)}sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showReset()});async function adminPanel(){openM('Admin · PoP Document Management',`<select id="sel" style="width:100%;padding:10px;border:1px solid #e5eaf0;border-radius:8px">${rooms.map(r=>`<option>${r}</option>`).join('')}</select><div class="upload"><b>Upload documents</b><br><input type="file" id="files" accept="*/*" multiple style="margin-top:9px"><div class="file-types">PDF, Word, Excel, PowerPoint, images, ZIP and other file formats are supported.</div><div class="progress-wrap" id="progressWrap"><div class="progress-head"><span id="progressName">Preparing…</span><span id="progressPercent">0%</span></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div></div><div id="uploadStatus" class="status"></div></div><div id="list"></div><button class="btn light" style="margin-top:12px" onclick="sb.auth.signOut();closeM()">Sign out</button>`);document.getElementById('sel').onchange=adminRefresh;document.getElementById('files').onchange=upload;adminRefresh()}async function adminRefresh(){let r=document.getElementById('sel').value,list=await getDocs(r);document.getElementById('list').innerHTML=list.map(d=>`<div class="doc"><span>${esc(d.file_name)}</span></div>`).join('')||'<p style="font-size:12px;color:#718096">No documents.</p>'}function setProgress(name,p){const w=document.getElementById('progressWrap'),b=document.getElementById('progressBar'),n=document.getElementById('progressName'),pc=document.getElementById('progressPercent');if(!w)return;w.classList.add('show');n.textContent=name;const v=Math.max(0,Math.min(100,p));b.style.width=v+'%';pc.textContent=Math.round(v)+'%'}function uploadOne(session,r,f,onProgress){return new Promise(async(resolve,reject)=>{const path=r+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const parts=path.split('/').map(encodeURIComponent).join('/');const xhr=new XMLHttpRequest();xhr.open('POST',SUPA_URL+'/storage/v1/object/pop-documents/'+parts);xhr.setRequestHeader('Authorization','Bearer '+session.access_token);xhr.setRequestHeader('apikey',SUPA_KEY);xhr.setRequestHeader('x-upsert','false');xhr.setRequestHeader('cache-control','3600');xhr.setRequestHeader('content-type',f.type||'application/octet-stream');xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(Math.round(e.loaded/e.total*100))};xhr.onload=async()=>{if(xhr.status>=200&&xhr.status<300){const ins=await sb.from('pop_documents').insert({pop_name:r,file_name:f.name,file_type:f.type||'application/octet-stream',file_size:f.size,storage_path:path});if(ins.error){reject(new Error('Database record failed: '+ins.error.message));return}resolve()}else{let msg='Upload failed';try{const j=JSON.parse(xhr.responseText);msg=j.message||j.error||msg}catch(e){}reject(new Error(msg+' ('+xhr.status+')'))}};xhr.onerror=()=>reject(new Error('Network error during upload'));xhr.onabort=()=>reject(new Error('Upload cancelled'));xhr.send(f)})}async function upload(){const session=(await sb.auth.getSession()).data.session;if(!session){alert('Please sign in again.');return}const r=document.getElementById('sel').value,input=document.getElementById('files'),status=document.getElementById('uploadStatus');const files=Array.from(input.files||[]);if(!files.length)return;status.className='status';status.textContent='Starting upload…';let done=0;try{for(const f of files){setProgress('Uploading '+f.name,0);await uploadOne(session,r,f,p=>{const overall=((done+p/100)/files.length)*100;setProgress('Uploading '+f.name,p);document.getElementById('progressBar').style.width=overall+'%';document.getElementById('progressPercent').textContent=Math.round(overall)+'%'});done++;setProgress(done===files.length?'Upload complete':'Completed '+f.name,(done/files.length)*100)}status.className='status success';status.textContent=files.length===1?'File uploaded successfully.':files.length+' files uploaded successfully.';input.value='';adminRefresh()}catch(e){status.className='status';status.textContent=e.message||'Upload failed.'}}render();</script></body></html>

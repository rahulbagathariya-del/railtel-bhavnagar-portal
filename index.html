<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RailTel Corporation Of India Limited | Bhavnagar Division</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>:root{--b:#0757a5;--r:#d71920;--t:#172033;--m:#718096;--l:#e5eaf0;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,Arial,sans-serif}.top{height:3px;background:linear-gradient(90deg,var(--b) 0 82%,var(--r) 82%)}header{background:#fff;border-bottom:1px solid var(--l)}.nav,.hero,.content{max-width:1080px;margin:auto;padding-left:20px;padding-right:20px}.nav{padding-top:15px;padding-bottom:15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px}.mark{width:44px;height:44px;border-radius:10px;background:#fff;border:2px solid var(--b);color:var(--b);display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:-1px;position:relative}.mark:after{content:'↗';position:absolute;font-size:13px;color:var(--r);right:3px;top:1px}.brand strong{font-size:18px}.brand small{display:block;color:var(--m);font-size:11px;margin-top:2px}.admin{border:1px solid var(--l);background:#fff;color:var(--b);padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:600}.hero{padding-top:42px;padding-bottom:28px}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:var(--m);font-size:13px}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:8px 0 18px}.bar h2{font-size:17px;margin:0}.search{width:260px;border:1px solid var(--l);background:#fff;border-radius:8px;padding:10px 12px;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.room{background:#fff;border:1px solid var(--l);border-radius:11px;padding:17px}.room h3{margin:0;font-size:17px}.room p{margin:6px 0 16px;color:var(--m);font-size:11px}.actions{display:flex;gap:7px}.btn{border:0;border-radius:7px;padding:8px 10px;font-size:11px;font-weight:650;cursor:pointer}.primary{background:var(--b);color:#fff}.light{background:#eef4fa;color:var(--b)}footer{text-align:center;border-top:1px solid var(--l);background:#fff;padding:20px;color:var(--m);font-size:11px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.panel{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:20px}.close{float:right;border:0;background:#f1f4f7;border-radius:7px;padding:6px 9px;cursor:pointer}.doc{border:1px solid var(--l);padding:10px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.qr{text-align:center}.qrbox{width:232px;height:232px;margin:16px auto;display:flex;align-items:center;justify-content:center;padding:16px;border:1px solid var(--l);border-radius:10px;background:#fff}.qrbox canvas{display:block!important;margin:0!important}.url{font-size:10px;color:var(--m);word-break:break-all}.login{max-width:320px;margin:auto}.login input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--l);border-radius:8px}.upload{margin-top:15px;padding:18px;border:1px dashed #cbd6e2;border-radius:9px;text-align:center;font-size:12px;color:var(--m)}.notice{font-size:11px;color:var(--m);margin-top:12px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.bar{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:470px){.grid{grid-template-columns:1fr}.hero h1{font-size:26px}.admin{font-size:11px}}</style></head><body><div class="top"></div><header><div class="nav"><div class="brand"><div class="mark">RT</div><div><strong>RailTel</strong><small>RailTel Corporation Of India Limited · Bhavnagar Division</small></div></div><button class="admin" onclick="adminLogin()">Admin Login</button></div></header><section class="hero"><h1>PoP Details Portal</h1><p>Read-only access to PoP information, documents and QR codes.</p></section><main class="content"><div class="bar"><h2>PoP Locations</h2><input class="search" id="search" placeholder="Search PoP location" oninput="render()"></div><div class="grid" id="grid"></div></main><footer>RailTel Corporation Of India Limited · Bhavnagar Division</footer><div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="panel"><button class="close" onclick="closeM()">×</button><h2 id="title"></h2><div id="body"></div></div></div><script>const rooms=['Bhavnagar','Dhola','Botad','Dhasa','Khijadiya'],key='railtel_docs_v2';let docs=JSON.parse(localStorage.getItem(key)||'{}');rooms.forEach(r=>docs[r]??=[]);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(key,JSON.stringify(docs))}function url(r){return location.href.split('#')[0]+'#pop='+encodeURIComponent(r)}function render(){let q=document.getElementById('search').value.toLowerCase(),g=document.getElementById('grid');g.innerHTML=rooms.filter(r=>r.toLowerCase().includes(q)).map(r=>`<article class="room"><h3>${r}</h3><p>RailTel · PoP Location</p><div class="actions"><button class="btn primary" onclick="details('${r}')">View PoP Details</button><button class="btn light" onclick="qr('${r}')">QR Code</button></div></article>`).join('')}function openM(t,b){document.getElementById('title').textContent=t;document.getElementById('body').innerHTML=b;document.getElementById('modal').classList.add('open')}function closeM(){document.getElementById('modal').classList.remove('open')}function details(r){let list=docs[r].length?docs[r].map((d,i)=>`<div class="doc"><span>📄 ${esc(d.name)}</span><button class="btn light" onclick="view('${r}',${i})">Open</button></div>`).join(''):'<p style="color:#718096;font-size:12px">No documents uploaded yet.</p>';openM(r+' PoP Details',`<p style="color:#718096;font-size:12px">Read-only PoP information and documents.</p>${list}`)}function qr(r){openM(r+' · PoP QR Code',`<div class="qr"><b>Scan to open ${r} PoP Details</b><div class="qrbox" id="code"></div><div class="url">${esc(url(r))}</div><button class="btn primary" onclick="window.print()">Print QR</button></div>`);const box=document.getElementById('code');new QRCode(box,{text:url(r),width:200,height:200,colorDark:'#0757a5',colorLight:'#fff'});const img=box.querySelector('img');if(img)img.remove()}function adminLogin(){openM('Admin Login',`<div class="login"><p style="color:#718096;font-size:12px">Only authorized administrators can manage PoP documents.</p><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:6px" onclick="login()">Sign in</button><div class="notice">Admin access is restricted.</div></div>`)}function login(){if(document.getElementById('user').value==='admin'&&document.getElementById('pass').value==='Rahul@40434'){adminPanel()}else alert('Invalid admin credentials')}function adminPanel(){openM('Admin · PoP Document Management',`<select id="sel" style="width:100%;padding:10px;border:1px solid #e5eaf0;border-radius:8px">${rooms.map(r=>`<option>${r}</option>`).join('')}</select><div class="upload">Upload PDF / document<br><input type="file" id="files" multiple style="margin-top:9px"></div><div id="list"></div>`);document.getElementById('sel').onchange=adminRefresh;document.getElementById('files').onchange=upload;adminRefresh()}function adminRefresh(){let r=document.getElementById('sel').value;document.getElementById('list').innerHTML=docs[r].map((d,i)=>`<div class="doc"><span>${esc(d.name)}</span><button class="btn light" onclick="del('${r}',${i})">Delete</button></div>`).join('')||'<p style="font-size:12px;color:#718096">No documents.</p>'}function upload(){let r=document.getElementById('sel').value;[...document.getElementById('files').files].forEach(f=>{let rd=new FileReader();rd.onload=()=>{docs[r].push({name:f.name,size:f.size,type:f.type,data:rd.result});save();adminRefresh()};rd.readAsDataURL(f)})}function del(r,i){if(confirm('Delete this document?')){docs[r].splice(i,1);save();adminRefresh()}}function view(r,i){let d=docs[r][i],w=window.open();if(d.type==='application/pdf'||d.type.startsWith('image/'))w.document.write(`<iframe src="${d.data}" style="width:100%;height:100vh;border:0"></iframe>`);else w.document.write(`<a href="${d.data}" download="${esc(d.name)}">Download ${esc(d.name)}</a>`)}render();</script></body></html>
